<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack</title>
  <meta name="description" content="Play blackjack in your browser, powered by the Deck of Cards API." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="login-screen" class="login">
    <div class="login-card">
      <div class="login-suits" aria-hidden="true">♠ ♥ ♣ ♦</div>
      <h1>Blackjack</h1>
      <p>Sign in to take a seat at the table.</p>
      <button id="google-login" class="google-btn">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <p id="login-error" class="login-error" role="alert"></p>
    </div>
  </section>

  <main id="game" class="table hidden">
    <div class="userbar">
      <img id="avatar" class="avatar hidden" alt="" referrerpolicy="no-referrer" />
      <span id="avatar-fallback" class="avatar avatar-fallback hidden" aria-hidden="true"></span>
      <span id="greeting" class="greeting"></span>
      <button id="sign-out" class="link">Sign out</button>
    </div>

    <header class="topbar">
      <h1>Blackjack</h1>
      <div class="stats">
        <div class="stat"><span class="label">Bankroll</span><span id="bankroll" class="value">$0</span></div>
        <div class="stat"><span class="label">Bet</span><span id="bet" class="value">$0</span></div>
        <div class="stat"><span class="label">Shoe</span><span id="remaining" class="value">–</span></div>
      </div>
    </header>

    <section class="area dealer-area">
      <h2>Dealer <span id="dealer-score" class="score"></span></h2>
      <div id="dealer-cards" class="cards"></div>
    </section>

    <p id="message" class="message" role="status" aria-live="polite">Connecting to the deck…</p>

    <section class="area player-area">
      <h2>You</h2>
      <div id="player-hands" class="hands"></div>
    </section>

    <section id="betting" class="controls">
      <div class="chips">
        <button class="chip chip-5" data-chip="5">5</button>
        <button class="chip chip-25" data-chip="25">25</button>
        <button class="chip chip-100" data-chip="100">100</button>
        <button class="chip chip-500" data-chip="500">500</button>
      </div>
      <div class="buttons">
        <button id="clear-bet" class="btn secondary">Clear</button>
        <button id="deal" class="btn primary">Deal</button>
      </div>
    </section>

    <section id="actions" class="controls hidden">
      <div class="buttons">
        <button id="hit" class="btn">Hit</button>
        <button id="stand" class="btn">Stand</button>
        <button id="double" class="btn">Double</button>
        <button id="split" class="btn">Split</button>
      </div>
    </section>

    <footer class="footer">
      <p>Dealer stands on soft 17 · Blackjack pays 3:2 · 6-deck shoe</p>
      <p>
        <button id="reset" class="link">Reset bankroll</button> ·
        Cards by <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">Deck of Cards API</a>
      </p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
